<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meniu în buget</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * { box-sizing: border-box; }

    :root {
      --green: #236b45;
      --green-dark: #174b31;
      --bg: #f5f7f2;
      --text: #202820;
      --muted: #657164;
      --border: #dce4d8;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }

    header {
      padding: 28px 20px;
      color: white;
      background: var(--green-dark);
    }

    header > div, main { max-width: 1000px; margin: auto; }
    header h1 { margin: 0 0 4px; }
    header p { margin: 0; color: #e1eee4; }

    main { padding: 22px 16px 48px; }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px #2030200b;
    }

    h2 { margin: 0 0 12px; font-size: 1.3rem; }
    label { display: block; font-weight: 650; margin: 12px 0 5px; }

    input, select, button {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #cbd6c8;
      border-radius: 9px;
      background: white;
      color: var(--text);
      font: inherit;
    }

    button {
      border: 0;
      background: var(--green);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: var(--green-dark); }
    button.secondary { background: #edf4ee; color: var(--green-dark); border: 1px solid var(--border); }
    button.secondary:hover { background: #e1ede3; }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .muted, .status { color: var(--muted); }
    .status { margin: 12px 0 0; }

    #map {
      height: 390px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #e9efe5;
    }

    #stores { display: grid; gap: 10px; margin-top: 14px; }

    .store {
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 13px;
    }

    .store h3 { margin: 0 0 4px; font-size: 1.05rem; }
    .store p { margin: 3px 0; }
    .store button { margin-top: 9px; }

    .meal { border-top: 1px solid #e7ece5; padding: 12px 0; }
    .meal h3 { margin: 0; }
    [hidden] { display: none !important; }

    @media (max-width: 600px) {
      header { padding: 22px 16px; }
      .grid, .actions { grid-template-columns: 1fr; }
      #map { height: 320px; }
    }
  </style>
</head>

<body>
<header>
  <div>
    <h1>Meniu în buget</h1>
    <p>Mese planificate pentru bugetul și ingredientele tale.</p>
  </div>
</header>

<main>
  <section class="card">
    <h2>Planifică mesele</h2>
    <form id="planner">
      <div class="grid">
        <div>
          <label for="budget">Buget pentru 3 zile (lei)</label>
          <input id="budget" type="number" min="20" value="150" required>
        </div>
        <div>
          <label for="people">Număr de persoane</label>
          <input id="people" type="number" min="1" value="2" required>
        </div>
      </div>

      <label for="preference">Preferință alimentară</label>
      <select id="preference">
        <option value="oricare">Fără preferințe</option>
        <option value="vegetarian">Vegetarian</option>
      </select>

      <label for="pantry">Ce ai deja? (separate prin virgulă)</label>
      <input id="pantry" placeholder="ex.: orez, ceapă, ouă">

      <button style="margin-top:16px" type="submit">Creează meniul</button>
    </form>
    <div id="menuResults" hidden aria-live="polite"></div>
  </section>

  <section class="card">
    <h2>Găsește supermarketuri</h2>
    <p class="muted">Caută magazine într-un oraș și vezi numele, programul și traseul.</p>

    <label for="city">Oraș sau localitate</label>
    <input id="city" placeholder="ex.: Cluj-Napoca">

    <div class="actions">
      <button id="searchCity" type="button">Caută magazine</button>
      <button id="locateMe" class="secondary" type="button">Folosește locația mea</button>
    </div>

    <p id="mapStatus" class="status" aria-live="polite"></p>
    <div id="map" aria-label="Hartă cu supermarketuri"></div>
    <div id="stores"></div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Prototip: exemple de rețete, cu prețuri orientative pentru o persoană.
  const recipes = [
    { name: "Orez cu legume", type: "vegetarian", cost: 24, ingredients: ["orez", "morcovi", "ceapă", "mazăre"], time: "25 min" },
    { name: "Paste cu sos de roșii", type: "vegetarian", cost: 22, ingredients: ["paste", "roșii", "ceapă", "usturoi"], time: "20 min" },
    { name: "Omletă cu cartofi", type: "vegetarian", cost: 20, ingredients: ["ouă", "cartofi", "ceapă"], time: "25 min" },
    { name: "Tocăniță de linte", type: "vegetarian", cost: 26, ingredients: ["linte", "morcovi", "ceapă", "roșii"], time: "35 min" },
    { name: "Pui cu orez", type: "oricare", cost: 34, ingredients: ["pui", "orez", "morcovi", "ceapă"], time: "40 min" },
    { name: "Paste cu pui", type: "oricare", cost: 32, ingredients: ["paste", "pui", "roșii"], time: "30 min" }
  ];

  document.querySelector("#planner").addEventListener("submit", event => {
    event.preventDefault();

    const budget = Number(document.querySelector("#budget").value);
    const people = Number(document.querySelector("#people").value);
    const preference = document.querySelector("#preference").value;
    const pantry = document.querySelector("#pantry").value
      .toLocaleLowerCase("ro").split(",").map(x => x.trim()).filter(Boolean);

    const candidates = recipes
      .filter(r => preference === "oricare" || r.type === preference)
      .map(r => ({ ...r, total: r.cost * people }))
      .filter(r => r.total <= budget)
      .sort((a, b) =>
        b.ingredients.filter(x => pantry.includes(x)).length -
        a.ingredients.filter(x => pantry.includes(x)).length
      );

    let chosen = [];
    let total = 0;
    for (const recipe of candidates) {
      if (chosen.length < 3 && total + recipe.total <= budget) {
        chosen.push(recipe);
        total += recipe.total;
      }
    }

    const results = document.querySelector("#menuResults");
    results.hidden = false;

    if (!chosen.length) {
      results.innerHTML = "<p>Bugetul este prea mic pentru exemplele disponibile. Încearcă o sumă mai mare.</p>";
      return;
    }

    const shopping = [...new Set(chosen.flatMap(r => r.ingredients))]
      .filter(item => !pantry.includes(item));

    results.innerHTML = `
      <h2 style="margin-top:22px">Meniul tău pentru 3 zile</h2>
      <p><strong>Cost estimat:</strong> aproximativ ${total} lei pentru ${people} ${people === 1 ? "persoană" : "persoane"}.</p>
      ${chosen.map((r, i) => `
        <article class="meal">
          <h3>Ziua ${i + 1}: ${r.name}</h3>
          <p class="muted">${r.time} · aproximativ ${r.total} lei</p>
          <p>Ingrediente: ${r.ingredients.join(", ")}</p>
        </article>`).join("")}
      <h3>Listă de cumpărături</h3>
      ${shopping.length ? `<ul>${shopping.map(x => `<li>${x}</li>`).join("")}</ul>` : "<p>Ai deja toate ingredientele din meniu.</p>"}
      <p class="muted">Prețurile sunt demonstrative.</p>`;
  });

  const map = L.map("map").setView([45.9432, 24.9668], 6);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  const markers = L.layerGroup().addTo(map);
  let userLocation = null;
  let selectedMarker = null;

  const status = document.querySelector("#mapStatus");
  const storeList = document.querySelector("#stores");

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);
  }

  function openingHours(tags) {
    if (tags.opening_hours) return tags.opening_hours;
    return "Program indisponibil";
  }

  function showStores(elements) {
    markers.clearLayers();
    storeList.replaceChildren();
    selectedMarker = null;

    if (!elements.length) {
      status.textContent = "Nu am găsit magazine în această localitate. Încearcă altă denumire.";
      return;
    }

    status.textContent = `Am găsit ${elements.length} magazine. Selectează unul pentru detalii și traseu.`;

    elements.forEach((place, index) => {
      const lat = place.lat ?? place.center?.lat;
      const lon = place.lon ?? place.center?.lon;
      if (lat == null || lon == null) return;

      const tags = place.tags || {};
      const name = tags.name || tags.brand || "Supermarket fără nume în hartă";
      const address = [
        tags["addr:street"],
        tags["addr:housenumber"],
        tags["addr:city"]
      ].filter(Boolean).join(" ") || "Adresă indisponibilă";

      const marker = L.marker([lat, lon]).addTo(markers);
      marker.bindPopup(`<strong>${escapeHtml(name)}</strong><br>${escapeHtml(address)}`);

      const card = document.createElement("article");
      card.className = "store";
      card.innerHTML = `
        <h3>${escapeHtml(name)}</h3>
        <p>${escapeHtml(address)}</p>
        <p><strong>Program:</strong> ${escapeHtml(openingHours(tags))}</p>
        <button type="button">Vezi magazinul și traseul</button>`;

      card.querySelector("button").addEventListener("click", () => {
        selectedMarker = [lat, lon];
        map.setView(selectedMarker, 15);
        marker.openPopup();

        const directions = userLocation
          ? `https://www.google.com/maps/dir/?api=1&origin=${userLocation[0]},${userLocation[1]}&destination=${lat},${lon}&travelmode=driving`
          : `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}&travelmode=driving`;

        card.querySelector("button").textContent = "Deschide traseul în Google Maps";
        card.querySelector("button").onclick = () => window.open(directions, "_blank", "noopener");
      });

      storeList.appendChild(card);
    });

    const group = L.featureGroup(markers.getLayers());
    if (group.getLayers().length) map.fitBounds(group.getBounds().pad(0.15));
  }

  async function searchSupermarkets(lat, lon, radius = 10000) {
    status.textContent = "Caut supermarketuri…";
    storeList.replaceChildren();

    const query = `[out:json][timeout:25];
      (
        node["shop"~"supermarket|convenience"](around:${radius},${lat},${lon});
        way["shop"~"supermarket|convenience"](around:${radius},${lat},${lon});
        relation["shop"~"supermarket|convenience"](around:${radius},${lat},${lon});
      );
      out center tags;`;

    try {
      const response = await fetch("https://overpass-api.de/api/interpreter", {
        method: "POST",
        body: new URLSearchParams({ data: query })
      });
      if (!response.ok) throw new Error("Serviciul de căutare nu răspunde.");
      const data = await response.json();
      showStores(data.elements || []);
    } catch (error) {
      status.textContent = "Căutarea nu a reușit acum. Încearcă din nou peste puțin timp.";
    }
  }

  async function searchCity() {
    const city = document.querySelector("#city").value.trim();
    if (!city) {
      status.textContent = "Scrie mai întâi numele unui oraș sau al unei localități.";
      return;
    }

    status.textContent = "Caut localitatea…";
    try {
      async function searchCity() {
  const city = document.querySelector("#city").value.trim();

  if (!city) {
    status.textContent = "Scrie numele unui oraș sau al unei localități.";
    return;
  }

  status.textContent = "Caut localitatea…";

  try {
    const url = new URL("https://nominatim.openstreetmap.org/search");
    url.searchParams.set("q", city);
    url.searchParams.set("countrycodes", "ro");
    url.searchParams.set("format", "jsonv2");
    url.searchParams.set("limit", "1");
    url.searchParams.set("accept-language", "ro");

    const response = await fetch(url.toString());

    if (!response.ok) {
      throw new Error(`Eroare ${response.status}`);
    }

    const places = await response.json();

    if (!places.length) {
      status.textContent = `Nu am găsit „${city}”. Încearcă fără diacritice sau adaugă județul.`;
      return;
    }

    const place = places[0];
    const lat = Number(place.lat);
    const lon = Number(place.lon);

    map.setView([lat, lon], 13);
    await searchSupermarkets(lat, lon);
  } catch (error) {
    status.textContent = `Căutarea localității a eșuat: ${error.message}`;
  }
}


  document.querySelector("#searchCity").addEventListener("click", searchCity);
  document.querySelector("#city").addEventListener("keydown", event => {
    if (event.key === "Enter") {
      event.preventDefault();
      searchCity();
    }
  });

  document.querySelector("#locateMe").addEventListener("click", () => {
    if (!navigator.geolocation) {
      status.textContent = "Browserul nu permite accesul la locație.";
      return;
    }

    status.textContent = "Se solicită locația…";
    navigator.geolocation.getCurrentPosition(
      position => {
        userLocation = [position.coords.latitude, position.coords.longitude];
        L.circleMarker(userLocation, { radius: 8, color: "#1769aa" })
          .addTo(map).bindPopup("Locația ta").openPopup();
        map.setView(userLocation, 14);
        searchSupermarkets(userLocation[0], userLocation[1]);
      },
      () => {
        status.textContent = "Nu am putut accesa locația. Permite accesul în browser sau caută după oraș.";
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });
</script>
</body>
</html>
