<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meniu în buget</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * { box-sizing: border-box; }

    :root {
      --green: #236b45;
      --green-dark: #174b31;
      --bg: #f5f7f2;
      --text: #202820;
      --muted: #657164;
      --border: #dce4d8;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }

    header {
      padding: 26px 20px;
      background: var(--green-dark);
      color: white;
    }

    header > div, main { max-width: 1000px; margin: auto; }
    header h1 { margin: 0 0 4px; }
    header p { margin: 0; color: #e1eee4; }

    main { padding: 22px 16px 48px; }

    .card {
      margin-bottom: 18px;
      padding: 20px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 4px 18px #2030200b;
    }

    h2 { margin: 0 0 12px; font-size: 1.3rem; }
    label { display: block; margin: 12px 0 5px; font-weight: 650; }

    input, select, button {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #cbd6c8;
      border-radius: 9px;
      background: white;
      color: var(--text);
      font: inherit;
    }

    button {
      border: 0;
      background: var(--green);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: var(--green-dark); }
    button.secondary { background: #edf4ee; color: var(--green-dark); border: 1px solid var(--border); }
    button.secondary:hover { background: #e1ede3; }

    .grid, .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .actions { margin-top: 14px; }
    .muted, .status { color: var(--muted); }
    .status { margin: 12px 0; }

    #map {
      height: 380px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #e9efe5;
    }

    #stores { display: grid; gap: 10px; margin-top: 14px; }

    .store {
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
    }

    .store h3 { margin: 0 0 4px; font-size: 1.05rem; }
    .store p { margin: 3px 0; }
    .store button { margin-top: 9px; }

    .meal { padding: 12px 0; border-top: 1px solid #e7ece5; }
    .meal h3 { margin: 0; }

    [hidden] { display: none !important; }

    @media (max-width: 600px) {
      header { padding: 22px 16px; }
      .grid, .actions { grid-template-columns: 1fr; }
      #map { height: 320px; }
    }
  </style>
</head>

<body>
<header>
  <div>
    <h1>Meniu în buget</h1>
    <p>Mese planificate pentru bugetul și ingredientele tale.</p>
  </div>
</header>

<main>
  <section class="card">
    <h2>Planifică mesele</h2>

    <form id="planner">
      <div class="grid">
        <div>
          <label for="budget">Buget pentru 3 zile (lei)</label>
          <input id="budget" type="number" min="20" value="150" required>
        </div>
        <div>
          <label for="people">Număr de persoane</label>
          <input id="people" type="number" min="1" value="2" required>
        </div>
      </div>

      <label for="preference">Preferință alimentară</label>
      <select id="preference">
        <option value="oricare">Fără preferințe</option>
        <option value="vegetarian">Vegetarian</option>
      </select>

      <label for="pantry">Ce ai deja? (separate prin virgulă)</label>
      <input id="pantry" placeholder="ex.: orez, ceapă, ouă">

      <button style="margin-top:16px" type="submit">Creează meniul</button>
    </form>

    <div id="menuResults" hidden aria-live="polite"></div>
  </section>

  <section class="card">
    <h2>Găsește supermarketuri</h2>
    <p class="muted">Caută magazine după oraș sau folosește locația dispozitivului.</p>

    <label for="city">Oraș sau localitate</label>
    <input id="city" placeholder="ex.: Cluj-Napoca">

    <div class="actions">
      <button id="searchCity" type="button">Caută magazine</button>
      <button id="locateMe" class="secondary" type="button">Folosește locația mea</button>
    </div>

    <p id="mapStatus" class="status" aria-live="polite"></p>
    <div id="map" aria-label="Hartă cu supermarketuri"></div>
    <div id="stores"></div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const recipes = [
    { name: "Orez cu legume", type: "vegetarian", cost: 24, ingredients: ["orez", "morcovi", "ceapă", "mazăre"], time: "25 min" },
    { name: "Paste cu sos de roșii", type: "vegetarian", cost: 22, ingredients: ["paste", "roșii", "ceapă", "usturoi"], time: "20 min" },
    { name: "Omletă cu cartofi", type: "vegetarian", cost: 20, ingredients: ["ouă", "cartofi", "ceapă"], time: "25 min" },
    { name: "Tocăniță de linte", type: "vegetarian", cost: 26, ingredients: ["linte", "morcovi", "ceapă", "roșii"], time: "35 min" },
    { name: "Pui cu orez", type: "oricare", cost: 34, ingredients: ["pui", "orez", "morcovi", "ceapă"], time: "40 min" },
    { name: "Paste cu pui", type: "oricare", cost: 32, ingredients: ["paste", "pui", "roșii"], time: "30 min" }
  ];

  document.querySelector("#planner").addEventListener("submit", event => {
    event.preventDefault();

    const budget = Number(document.querySelector("#budget").value);
    const people = Number(document.querySelector("#people").value);
    const preference = document.querySelector("#preference").value;
    const pantry = document.querySelector("#pantry").value
      .toLocaleLowerCase("ro")
      .split(",")
      .map(item => item.trim())
      .filter(Boolean);

    const candidates = recipes
      .filter(recipe => preference === "oricare" || recipe.type === preference)
      .map(recipe => ({ ...recipe, total: recipe.cost * people }))
      .filter(recipe => recipe.total <= budget)
      .sort((a, b) =>
        b.ingredients.filter(item => pantry.includes(item)).length -
        a.ingredients.filter(item => pantry.includes(item)).length
      );

    const chosen = [];
    let total = 0;

    for (const recipe of candidates) {
      if (chosen.length < 3 && total + recipe.total <= budget) {
        chosen.push(recipe);
        total += recipe.total;
      }
    }

    const results = document.querySelector("#menuResults");
    results.hidden = false;

    if (!chosen.length) {
      results.innerHTML = "<p>Bugetul este prea mic pentru exemplele disponibile. Încearcă o sumă mai mare.</p>";
      return;
    }

    const shopping = [...new Set(chosen.flatMap(recipe => recipe.ingredients))]
      .filter(item => !pantry.includes(item));

    results.innerHTML = `
      <h2 style="margin-top:22px">Meniul tău pentru 3 zile</h2>
      <p><strong>Cost estimat:</strong> aproximativ ${total} lei pentru ${people} ${people === 1 ? "persoană" : "persoane"}.</p>
      ${chosen.map((recipe, index) => `
        <article class="meal">
          <h3>Ziua ${index + 1}: ${recipe.name}</h3>
          <p class="muted">${recipe.time} · aproximativ ${recipe.total} lei</p>
          <p>Ingrediente: ${recipe.ingredients.join(", ")}</p>
        </article>
      `).join("")}
      <h3>Listă de cumpărături</h3>
      ${shopping.length
        ? `<ul>${shopping.map(item => `<li>${item}</li>`).join("")}</ul>`
        : "<p>Ai deja toate ingredientele din meniu.</p>"}
      <p class="muted">Prețurile sunt demonstrative.</p>
    `;
  });

  const map = L.map("map").setView([45.9432, 24.9668], 6);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const markers = L.layerGroup().addTo(map);
  const status = document.querySelector("#mapStatus");
  const storeList = document.querySelector("#stores");
  let userLocation = null;
  let userMarker = null;

  function safeText(value) {
    const element = document.createElement("span");
    element.textContent = value || "";
    return element.innerHTML;
  }

  function showStores(elements) {
    markers.clearLayers();
    storeList.replaceChildren();

    if (!elements.length) {
      status.textContent = "Nu am găsit magazine în apropiere. Încearcă alt oraș.";
      return;
    }

    let displayed = 0;

    for (const place of elements) {
      const lat = place.lat ?? place.center?.lat;
      const lon = place.lon ?? place.center?.lon;
      if (lat == null || lon == null) continue;

      const tags = place.tags || {};
      const name = tags.name || tags.brand || "Magazin fără nume în hartă";
      const address = [
        tags["addr:street"],
        tags["addr:housenumber"],
        tags["addr:city"]
      ].filter(Boolean).join(" ") || "Adresă indisponibilă";
      const hours = tags.opening_hours || "Program indisponibil";

      const marker = L.marker([lat, lon]).addTo(markers);
      marker.bindPopup(`<strong>${safeText(name)}</strong><br>${safeText(address)}`);

      const card = document.createElement("article");
      card.className = "store";
      card.innerHTML = `
        <h3>${safeText(name)}</h3>
        <p>${safeText(address)}</p>
        <p><strong>Program:</strong> ${safeText(hours)}</p>
        <button type="button">Deschide traseul</button>
      `;

      card.querySelector("button").addEventListener("click", () => {
        marker.openPopup();

        const destination = `${lat},${lon}`;
        const origin = userLocation
          ? `&origin=${userLocation[0]},${userLocation[1]}`
          : "";

        const directionsUrl =
          `https://www.google.com/maps/dir/?api=1${origin}` +
          `&destination=${destination}&travelmode=driving`;

        window.open(directionsUrl, "_blank", "noopener");
      });

      storeList.appendChild(card);
      displayed++;
    }

    if (!displayed) {
      status.textContent = "Nu am găsit magazine cu locații afișabile.";
      return;
    }

    status.textContent = `Am găsit ${displayed} magazine. Alege unul pentru a deschide traseul.`;

    const layerItems = markers.getLayers();
    if (layerItems.length) {
      map.fitBounds(L.featureGroup(layerItems).getBounds().pad(0.15));
    }
  }

  async function searchSupermarkets(lat, lon) {
    status.textContent = "Caut supermarketuri…";
    storeList.replaceChildren();

    const query = `
      [out:json][timeout:25];
      (
        node["shop"~"supermarket|convenience"](around:10000,${lat},${lon});
        way["shop"~"supermarket|convenience"](around:10000,${lat},${lon});
        relation["shop"~"supermarket|convenience"](around:10000,${lat},${lon});
      );
      out center tags;
    `;

    try {
      const response = await fetch("https://overpass-api.de/api/interpreter", {
        method: "POST",
        body: new URLSearchParams({ data: query })
      });

      if (!response.ok) {
        throw new Error(`Serviciul de magazine a răspuns cu eroarea ${response.status}.`);
      }

      const data = await response.json();
      showStores(data.elements || []);
    } catch (error) {
      status.textContent = `Nu am putut încărca magazinele: ${error.message}`;
    }
  }

  async function searchCity() {
    const city = document.querySelector("#city").value.trim();

    if (!city) {
      status.textContent = "Scrie mai întâi numele unui oraș sau al unei localități.";
      return;
    }

    status.textContent = "Caut localitatea…";
    storeList.replaceChildren();

    try {
      const url = new URL("https://photon.komoot.io/api/");
      url.searchParams.set("q", `${city}, Romania`);
      url.searchParams.set("lang", "ro");
      url.searchParams.set("limit", "5");

      const response = await fetch(url.toString());

      if (!response.ok) {
        throw new Error(`Serviciul de localități a răspuns cu eroarea ${response.status}.`);
      }

      const data = await response.json();
      const features = data.features || [];

      const place = features.find(feature =>
        feature.properties?.countrycode?.toUpperCase() === "RO"
      ) || features[0];

      if (!place || !place.geometry?.coordinates) {
        status.textContent = `Nu am găsit „${city}”. Încearcă numele fără județ sau cu diacritice.`;
        return;
      }

      const [lon, lat] = place.geometry.coordinates;

      if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
        status.textContent = "Rezultatul localității nu conține coordonate valide.";
        return;
      }

      map.setView([lat, lon], 13);
      await searchSupermarkets(lat, lon);
    } catch (error) {
      status.textContent = `Căutarea orașului a eșuat: ${error.message}`;
    }
  }

  document.querySelector("#searchCity").addEventListener("click", searchCity);

  document.querySelector("#city").addEventListener("keydown", event => {
    if (event.key === "Enter") {
      event.preventDefault();
      searchCity();
    }
  });

  document.querySelector("#locateMe").addEventListener("click", () => {
    if (!navigator.geolocation) {
      status.textContent = "Browserul nu oferă acces la locație.";
      return;
    }

    status.textContent = "Se solicită permisiunea pentru locație…";

    navigator.geolocation.getCurrentPosition(
      async position => {
        userLocation = [
          position.coords.latitude,
          position.coords.longitude
        ];

        if (userMarker) map.removeLayer(userMarker);

        userMarker = L.circleMarker(userLocation, {
          radius: 8,
          color: "#1769aa",
          fillColor: "#4aa3df",
          fillOpacity: 0.9
        }).addTo(map).bindPopup("Locația ta");

        map.setView(userLocation, 14);
        await searchSupermarkets(userLocation[0], userLocation[1]);
      },
      error => {
        status.textContent = error.code === 1
          ? "Accesul la locație a fost refuzat. Permite accesul în setările browserului sau caută după oraș."
          : "Nu am putut determina locația. Încearcă din nou sau caută după oraș.";
      },
      { enableHighAccuracy: true, timeout: 12000 }
    );
  });
</script>
</body>
</html>
